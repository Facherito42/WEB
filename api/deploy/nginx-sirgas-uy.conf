# /etc/nginx/sites-available/sirgas-uy
# Activar con:
#   sudo ln -s /etc/nginx/sites-available/sirgas-uy /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Sirve el sitio React (build) y hace de reverse proxy a la API RINEX.
# HTTPS: ver el bloque comentado abajo, se completa con certbot cuando IT
# publique el dominio.

server {
    listen 80;
    listen [::]:80;
    server_name _;          # cambiar por el dominio real cuando lo den (ej. sirgas.igm.gub.uy)

    root /var/www/sirgas-uy/html;   # acá va el CONTENIDO de app/dist/  (no el proyecto)
    index index.html;

    server_tokens off;             # no revelar la versión de Nginx

    # Compresión
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # --- Cabeceras de seguridad ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    # Activar HSTS SOLO cuando el sitio sirva 100% por HTTPS:
    # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.tile.openstreetmap.org; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # --- API de descarga RINEX ---
    location /rinex-data/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_buffering off;
        client_max_body_size 10m;
    }

    # --- Sitio estático (SSG con URLs limpias) ---
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    # Cache de assets con hash en el nombre
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location = /favicon.ico { access_log off; log_not_found off; }
}

# ---------------------------------------------------------------------------
# HTTPS (completar cuando IT publique el dominio):
#
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d sirgas.igm.gub.uy
#
# certbot agrega solo el bloque 443 y la redirección 80 -> 443.
# Después, descomentar la línea de Strict-Transport-Security de arriba.
# ---------------------------------------------------------------------------
